name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # No provider secrets: tests must pass without keys, and no paid calls run here.
    # Postgres is a disposable CI-only service with dummy local credentials.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-dummy-password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENABLE_LIVE_API_TESTS: "false"
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-dummy-password@localhost:5432/ci
      REQUIRE_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"

      - name: Lockfile matches pyproject
        run: uv lock --check

      - name: Install (locked)
        run: uv sync --frozen

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migrate empty database (plan command)
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://ci:ci-dummy-password@localhost:5432/ci
        run: uv run alembic upgrade head

      # Plan §12 Step 7, one visible step per area. The full suite below runs everything again.
      - name: Contracts and nutrition arithmetic
        run: uv run pytest -q tests/contracts tests/unit/test_calculator.py

      - name: Storage policy
        run: uv run pytest -q tests/unit/test_storage_policy.py

      - name: Migrations and inference-role access (disposable Postgres)
        run: uv run pytest -q tests/db/test_migrations.py tests/db/test_access.py tests/db/test_benchmark_load.py

      - name: Mock integration, both apps in process
        run: uv run pytest -q tests/integration tests/unit/test_app_independence.py

      - name: Mock integration, both apps as real HTTP processes
        env:
          MOCK_MODE: "true"
        run: |
          uv run uvicorn foodvision.api.provider_app:app --port 8001 &
          uv run uvicorn foodvision.api.agent_app:app --port 8002 &
          uv run python scripts/ci_mock_flow.py

      - name: Full test suite (database tests required, none skipped)
        run: uv run pytest -ra
