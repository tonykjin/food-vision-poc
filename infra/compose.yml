# Local PostgreSQL plus the four packaged services (POC-16). Every published port is bound to
# 127.0.0.1; never expose these publicly. The hosted pilot puts an authenticated reverse proxy
# in front of the two UIs only (docs/deployment-plan.md). The default Postgres password is a
# local-only development value, not a deployment secret.
#
#   docker compose -f infra/compose.yml up -d postgres                 # local dev database
#   docker compose -f infra/compose.yml --profile app-a up -d --build  # App A only
#   docker compose -f infra/compose.yml --profile app-b up -d --build  # App B only (+ postgres)
#
# App independence: each profile starts only its own services; each API container reads only its
# own env file; the UIs receive no secrets, only their own API's internal URL. The APIs have no
# published ports: only their own UI reaches them, server-side, on that app's own network.
name: foodvision

x-app: &app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  image: foodvision:${FOODVISION_TAG:-local}
  restart: unless-stopped

x-api-health: &api-health
  interval: 10s
  timeout: 5s
  retries: 6

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: foodvision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodvision_local_dev}
      POSTGRES_DB: foodvision
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [default, b_data]  # only b-api reaches the database; never App A or a UI
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodvision -d foodvision"]
      interval: 5s
      timeout: 3s
      retries: 10

  a-api:
    <<: *app
    profiles: [app-a]
    networks: [app_a]
    command: ["uvicorn", "foodvision.api.provider_app:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - path: ../.env.provider.local  # App A's secrets only (fatsecret)
        required: false
    environment:
      MOCK_MODE: ${FOODVISION_MOCK_MODE:-false}
    healthcheck:
      <<: *api-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4).status != 200)"]

  a-ui:
    <<: *app
    profiles: [app-a]
    networks: [app_a]
    command: ["streamlit", "run", "apps/provider_ui.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true", "--server.maxUploadSize", "10", "--browser.gatherUsageStats", "false"]
    environment:
      PROVIDER_API_URL: http://a-api:8001  # no secrets in the UI
      STREAMLIT_SERVER_BASE_URL_PATH: app-a  # served at /app-a/ (directly and via the proxy)
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      a-api:
        condition: service_healthy
    healthcheck:
      <<: *api-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8501/app-a/_stcore/health', timeout=4).status != 200)"]

  b-api:
    <<: *app
    profiles: [app-b]
    networks: [app_b, b_data]
    command: ["uvicorn", "foodvision.api.agent_app:app", "--host", "0.0.0.0", "--port", "8002"]
    env_file:
      - path: ../.env.agent.local  # App B's secrets only (model key, inference DB login)
        required: false
    environment:
      MOCK_MODE: ${FOODVISION_MOCK_MODE:-false}
      # Inside the compose network the database host is `postgres`, not 127.0.0.1. Set
      # B_DATABASE_URL in the shell (an fv_inference login); it is never written to a file here.
      DATABASE_URL: ${B_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *api-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=4).status != 200)"]

  b-ui:
    <<: *app
    profiles: [app-b]
    networks: [app_b]
    command: ["streamlit", "run", "apps/agent_ui.py", "--server.port", "8502", "--server.address", "0.0.0.0",
              "--server.headless", "true", "--server.maxUploadSize", "10", "--browser.gatherUsageStats", "false"]
    environment:
      AGENT_API_URL: http://b-api:8002  # no secrets in the UI
      STREAMLIT_SERVER_BASE_URL_PATH: app-b
    ports:
      - "127.0.0.1:8502:8502"
    depends_on:
      b-api:
        condition: service_healthy
    healthcheck:
      <<: *api-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8502/app-b/_stcore/health', timeout=4).status != 200)"]

  # --- Pilot access (opt-in) -----------------------------------------------------------------
  # Login proxy in front of the two UIs only (never the APIs). Logins: scripts/pilot-user.ps1.
  proxy:
    image: caddy:2.11.7
    profiles: [pilot]
    restart: unless-stopped
    volumes:
      - ./pilot/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pilot/users.caddy:/etc/caddy/users.caddy:ro  # hashes only; git-ignored
    networks: [app_a, edge]  # App B isn't published, so the proxy can't reach it
    ports:
      - "127.0.0.1:8080:8080"

  # Public HTTPS link to the proxy (Cloudflare quick tunnel: no account; the URL changes on
  # each start and appears in `docker compose logs tunnel`). Start it only deliberately.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:8080"]
    networks: [edge]
    depends_on: [proxy]

# Separate networks: App A's containers can't reach App B's API or the database, and the
# reverse. Each UI reaches only its own API. The tunnel reaches only the proxy (`edge`).
networks:
  default:
  app_a:
  app_b:
  b_data:
  edge:

volumes:
  pgdata:
