[project]
name = "foodvision"
version = "0.1.0"
description = "Food Vision POC: provider (A) vs agent (B) image-to-nutrition comparison"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai==3.26.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "streamlit>=1.65.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
foodvision = "foodvision.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodvision"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
